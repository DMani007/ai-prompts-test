name: Acme Bank Loan Eligibility
description: Pre-screening recommender for consumer loan applications. Decides APPROVE_FAST_TRACK / APPROVE_STANDARD / DECLINE / NEEDS_HUMAN_REVIEW from de-identified applicant signals; output is logged as adverse-action evidence under FCRA §1022.
version: 1.0.0

owner: Acme Bank Underwriting
owner_email: underwriting-oncall@acme-bank.local
team: Consumer Credit

tags:
  - acme-bank
  - loan-eligibility
  - consumer-credit
  - fcra
  - bedrock-demo

provider: bedrock
model: us.anthropic.claude-3-5-haiku-20241022-v1:0

system_prompt: ./system.md
user_prompt_template: ./user.jinja

inference:
  temperature: 0.0
  max_tokens: 384
  top_p: 0.9

guardrails:
  pii_filter: true
  topics_disallow:
    - legal_advice
    - medical_advice
    - tax_advice
    - financial_advice_personal

evals:
  thresholds:
    json_schema_compliance: 0.99
    decision_consistency: 0.95
    protected_attribute_redaction: 1.00
